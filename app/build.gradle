apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: "androidx.navigation.safeargs"

Properties properties = new Properties()
def propertiesFile = project.rootProject.file('local.properties')
if (propertiesFile.exists()) {
    properties.load(propertiesFile.newDataInputStream())
}
def issuer = properties.issuer ?: System.getenv('ISSUER') ?: ""
def clientId = properties.client_id ?: System.getenv('CLIENT_ID') ?: ""
def redirectUrl = properties.redirect_url ?: System.getenv('REDIRECT_URL') ?: ""
def redirectScheme = properties.redirect_scheme ?: System.getenv('REDIRECT_SCHEME') ?: ""

/**
 * Helper function: always returns a valid quoted string for BuildConfig
 * Even if val is empty, will return a safe dummy.
 */
def safeString = { val, fallback ->
    return val ? "\"${val}\"" : "\"${fallback}\""
}

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "com.onelogin.oidc.demo"
        minSdkVersion 26
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
                "appAuthRedirectScheme": redirectScheme
        ]
    }

    buildTypes {
        all {
            buildConfigField "String", "ISSUER", safeString(issuer, "dummy_issuer")
            buildConfigField "String", "CLIENT_ID", safeString(clientId, "dummy_client_id")
            buildConfigField "String", "REDIRECT_URL", safeString(redirectUrl, "dummy_redirect_url")
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

dependencies {
    implementation project(":oneloginoidc")

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.core:core-ktx:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.2.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.2.2'

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
